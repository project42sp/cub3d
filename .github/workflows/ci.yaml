name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: norminette
        run: |
          pip install norminette
          norminette $(find . -name "*.[ch]" | grep -v tests)

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          cmake  \
          wget  \
          build-essential \
          libx11-dev \
          libxext-dev \
          libxrandr-dev \
          libbsd-dev \
          zlib1g-dev
      - name: compile cub3D
        run: make

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: run unit tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxext-dev \
            libbsd-dev \
            zlib1g-dev
          chmod +x ./scripts/cmocka_install.sh
          sudo ./scripts/cmocka_install.sh
          sudo ldconfig
          sudo apt install libcmocka0
          make unit-tests

